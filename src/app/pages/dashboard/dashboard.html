<main class="dashboard-page">
  @if (loading) {
    <p class="state-message">Dashboard wird geladen ...</p>
  } @else if (errorMessage) {
    <p class="state-message error">{{ errorMessage }}</p>
  } @else if (dashboard) {
  
    @if (dashboard.showWelcomeBox) {
      <app-welcome-box
        (startModules)="finishOnboardingAndNavigate('/module')"
        (startPlan)="finishOnboardingAndNavigate('/semesterplan')" />
    }

    <section class="placeholder-section">
      <h2>Dein Studienfortschritt</h2>
      <p>Die Kennzahlen und Semester kommen in den nächsten Tasks.</p>
    </section>
  }
</main>
