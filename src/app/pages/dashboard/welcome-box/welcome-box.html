<!-- Zeigt den Einstieg beim ersten Login und meldet Klicks an das Dashboard. -->
<section class="welcome-box">
  <div class="welcome-content">
    <p class="welcome-label">
      ERSTER LOGIN
    </p>
    <h2>
      Willkommen im Studienplaner.
    </h2>
    <p class="welcome-description">
      Hier siehst du deine echten Module, kannst deinen
      Fortschritt pflegen und deinen persönlichen
      Semesterplan aufbauen.
    </p>
  </div>
  <button
  type="button"
  class="welcome-button"
  (click)="start.emit()">
    Los geht's
    <span aria-hidden="true">
      →
    </span>
  </button>
</section>
